<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f1e6" />
    <meta name="description" content="Zeeshan & Fiza — wedding invitation coming soon." />
    <title>Zeeshan & Fiza — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Manrope:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="coming-soon" aria-label="Wedding invitation coming soon">
      <div class="coming-soon__glow" aria-hidden="true"></div>
      <div class="coming-soon__orb coming-soon__orb--a" aria-hidden="true"></div>
      <div class="coming-soon__orb coming-soon__orb--b" aria-hidden="true"></div>

      <div class="coming-soon__frame">
        <p class="coming-soon__kicker">A celebration awaits</p>

        <h1 class="coming-soon__names">
          <span>Zeeshan Akram</span>
          <em>&amp;</em>
          <span>Fiza Gull</span>
        </h1>

        <div class="coming-soon__divider" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path
              d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10Z"
              stroke="currentColor"
              stroke-width="1.2"
            />
          </svg>
          <span></span>
        </div>

        <p class="coming-soon__badge">Coming Soon</p>

        <p class="coming-soon__copy">
          Our digital invitation is being crafted with love.
          <br />
          Please check back soon.
        </p>

        <p class="coming-soon__hosts">Mr. &amp; Mrs. Haji Akram</p>
      </div>
    </main>
  </body>
</html>
